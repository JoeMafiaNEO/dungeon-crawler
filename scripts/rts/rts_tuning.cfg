; ============================================================================
; Warlord's Domain — balance tuning file.
; ----------------------------------------------------------------------------
; This is the ONE file with all RTS balance numbers. The game reads it at
; startup; anything you change here takes effect the next time you run.
;
; HOW TO RE-RUN THE BALANCE SIMULATION AFTER AN EDIT:
;   1. Edit a number below and save this file.
;   2. Run:  godot --headless --path . res://tools/sim/sim_harness.tscn -- --matches 6
;   3. Open tools/sim/output/report_<timestamp>.md and compare the win rates
;      against the previous report.
;
; Numbers not present here fall back to the defaults baked into the scripts.
; ============================================================================

[starting_resources]
wood = 200
food = 200
gold = 100
stone = 100

; Age-up costs (age 1 = Fortress, age 2 = Empire). Age 0 is free.
[age_costs]
age_1 = {"wood": 300, "food": 300, "gold": 0, "stone": 100}
age_2 = {"wood": 600, "food": 600, "gold": 400, "stone": 300}

; Population caps and gather multipliers per age [Settlement, Fortress, Empire].
[ages]
pop_caps = [30, 45, 60]
gather_bonus = [1.0, 1.25, 1.5]

[unit_costs]
villager = {"wood": 0, "food": 50, "gold": 0, "stone": 0}
spearman = {"wood": 0, "food": 60, "gold": 20, "stone": 0}
archer = {"wood": 50, "food": 40, "gold": 0, "stone": 0}
knight = {"wood": 0, "food": 100, "gold": 80, "stone": 0}
trade_cart = {"wood": 100, "food": 0, "gold": 0, "stone": 0}
catapult = {"wood": 150, "food": 0, "gold": 0, "stone": 100}
ram = {"wood": 200, "food": 0, "gold": 0, "stone": 50}
monk = {"wood": 0, "food": 0, "gold": 100, "stone": 0}
fishing_ship = {"wood": 100, "food": 0, "gold": 0, "stone": 0}
war_galley = {"wood": 150, "food": 0, "gold": 50, "stone": 0}

; Base combat stats per unit: hp, dmg, range (m), speed (m/s).
[unit_stats]
villager = {"hp": 40.0, "dmg": 3.0, "range": 1.2, "speed": 3.2}
spearman = {"hp": 80.0, "dmg": 8.0, "range": 1.5, "speed": 3.0}
archer = {"hp": 50.0, "dmg": 10.0, "range": 8.0, "speed": 3.0}
knight = {"hp": 140.0, "dmg": 14.0, "range": 1.8, "speed": 3.8}
trade_cart = {"hp": 60.0, "dmg": 0.0, "range": 0.0, "speed": 4.0}
catapult = {"hp": 80.0, "dmg": 40.0, "range": 15.0, "speed": 2.0}
ram = {"hp": 200.0, "dmg": 25.0, "range": 2.0, "speed": 2.5}
monk = {"hp": 40.0, "dmg": 0.0, "range": 0.0, "speed": 2.8}
fishing_ship = {"hp": 80.0, "dmg": 0.0, "range": 0.0, "speed": 3.5}
war_galley = {"hp": 120.0, "dmg": 15.0, "range": 10.0, "speed": 3.0}

; Seconds to train one unit.
[train_times]
villager = 8.0
spearman = 10.0
archer = 12.0
knight = 15.0
trade_cart = 12.0
catapult = 20.0
ram = 18.0
monk = 12.0
fishing_ship = 14.0
war_galley = 18.0

[building_costs]
barracks = {"wood": 150, "food": 0, "gold": 0, "stone": 0}
archery_range = {"wood": 150, "food": 0, "gold": 0, "stone": 0}
market = {"wood": 200, "food": 0, "gold": 0, "stone": 50}
siege_workshop = {"wood": 250, "food": 0, "gold": 0, "stone": 150}
monastery = {"wood": 200, "food": 0, "gold": 100, "stone": 100}
dock = {"wood": 200, "food": 0, "gold": 0, "stone": 0}
tower = {"wood": 0, "food": 0, "gold": 0, "stone": 100}

; Max HP per building.
[building_hp]
town_hall = 1500.0
barracks = 600.0
archery_range = 600.0
market = 500.0
siege_workshop = 700.0
monastery = 700.0
dock = 500.0
tower = 800.0

[buildings]
max_queue = 5
build_time = 20.0
tower_range = 12.0
tower_damage = 8.0
tower_cooldown = 1.5

; Per-civilization multipliers (1.0 = no bonus) and starting resource bonuses.
[civs]
iron_vanguard = {"spearman_hp_mult": 1.3, "spearman_dmg_mult": 1.15, "train_time_mult": 0.8, "townhall_hp_mult": 1.5, "start_wood": 0, "start_food": 0, "start_gold": 0}
shadow_covenant = {"archer_dmg_mult": 1.25, "archer_range_mult": 1.1, "move_speed_mult": 1.15, "gather_rate_mult": 1.1, "start_wood": 0, "start_food": 0, "start_gold": 0}
arcane_dominion = {"age_cost_mult": 0.7, "knight_dmg_mult": 1.3, "knight_hp_mult": 1.15, "start_wood": 100, "start_food": 100, "start_gold": 100}

; Villager gathering: resources per second before age/civ multipliers.
[economy]
gather_rate = 8.0
gather_tick = 1.0

; Trade carts: gold per delivery = max(min_payout, trip_distance / distance_divisor).
[trade]
min_payout = 20
distance_divisor = 2.0

; Siege damage multipliers vs buildings (ram is weak vs units).
[siege]
catapult_vs_building = 3.0
ram_vs_building = 4.0
ram_vs_unit = 0.25

; Monk conversion: channel time (s) and leash range (m).
[monks]
convert_time = 5.0
convert_range = 6.0

; Naval: fishing ship passive income, ship speed bonus on water.
[naval]
fish_amount = 5
fish_interval = 2.0
water_speed_mult = 1.5

; AI warlord behavior.
[ai]
think_interval = 3.0
villager_target = 12
army_target = [10, 16, 24]
vanguard_villager_target = 10
dominion_villager_target = 14
vanguard_army_bonus = 4
attack_threshold = 0.7
vanguard_attack_threshold = 0.5

; Map and resource nodes (cycle 0 values; cycle scaling below).
[map]
node_amounts = {"wood": 1000, "food": 800, "gold": 800, "stone": 800}
nodes_per_resource_per_faction = 8
nodes_cycle_bonus = 2
center_ring_nodes = 12
starting_cluster = {"wood": 6, "food": 4, "gold": 3, "stone": 2}
respawn_base = 75.0
respawn_cycle_reduction = 10.0
respawn_min = 30.0
faction_radius = 30.0

; Seconds between unit attacks.
[units]
attack_cooldown = 1.0
